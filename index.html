<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#EFEFEC" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Coinkeeper — личные финансы без лишнего шума." />
    <title>Coinkeeper</title>
    <script>
      // Apply the theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('ck.theme')) || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
